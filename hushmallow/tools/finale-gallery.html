<!doctype html>
<meta charset="utf-8"><title>Light finales</title>
<style>body{margin:0;background:#111;color:#fff;font:12px system-ui} canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// DEV ONLY: renders the 20 world-law light finales at three moments each.
import { drawLightFinale } from '../src/v3/laws.js';
import { REALMS } from '../src/world/realm.js';
const W = 220, H = 300, cols = 6, rows = 10;
const c = document.getElementById('c'); c.width = W * cols; c.height = H * rows;
const g = c.getContext('2d');
const pal = REALMS[new URLSearchParams(location.search).get('realm') || 'spiral-observatory'].palette;
const ts = [0.25, 0.55, 0.9];
for (let n = 1; n <= 20; n++) for (let k = 0; k < 3; k++) {
  const i = (n - 1) * 3 + k, x0 = (i % cols) * W, y0 = Math.floor(i / cols) * H;
  g.save(); g.beginPath(); g.rect(x0, y0, W, H); g.clip();
  const bg = g.createLinearGradient(0, y0, 0, y0 + H); bg.addColorStop(0, pal.sky); bg.addColorStop(1, pal.deep); g.fillStyle = bg; g.fillRect(x0, y0, W, H);
  const L = { stage: { x: x0 + 10, y: y0 + 20, w: W - 20, h: H - 40, cx: x0 + W / 2, cy: y0 + H / 2, s: 0.6 }, view: { w: W, h: H }, pal: { ...pal, warm: '#ffb37a' } };
  g.translate(0, 0);
  drawLightFinale(n, g, ts[k], L, {});
  g.restore();
  g.fillStyle = '#fff'; g.fillText(`law ${n} · t=${ts[k]}`, x0 + 6, y0 + 14);
}
document.title = 'done';
</script>
