# hushmallow production monitor (synthetic, read-only, no secrets).
# Install as .github/workflows/hushmallow-monitor.yml (the coordinator does).
#
# Every 10 minutes (and on request) runs hushmallow/tools/ops/monitor.mjs
# against https://app.hushmallow.com and the Another Angle Worker: the page,
# its CSP and HSTS, version.json against main, the published sign-in config
# (the Sydney project), the app's code, the /auth/callback headers and the
# Worker's /v1/health. Nothing is sent with credentials; no repository secret
# is read. On failure it opens ONE issue labelled "prod-monitor" (or comments
# on the open one); when production is healthy again it comments and closes it.
# GitHub may delay or skip scheduled runs under load; ten minutes is a target.
name: hushmallow monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      expect_version:
        description: 'Commit that must be live (blank: the last hushmallow/ change on main older than 30 minutes, or newer)'
        required: false
        default: ''
      allow_gate:
        description: 'The pilot gate is on: accept the gate page at / (CSP and HSTS still required)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: hushmallow-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versions that may be live
        id: versions
        run: |
          # The newest change to hushmallow/ on main that is over 30 minutes old must be live by now
          # (Pages builds each push in a few minutes); it or anything newer on main is accepted.
          expect="$(git log -1 --format=%H --before='30 minutes ago' -- hushmallow || true)"
          if [ -n "$expect" ]; then
            allowed="$(git rev-list "${expect}^..HEAD" 2>/dev/null | paste -sd, - || true)"
            [ -n "$allowed" ] || allowed="$expect"
          else
            allowed=""
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "oldest acceptable: ${expect:-none}"

      - name: Check production
        id: check
        env:
          MONITOR_EXPECT_VERSION: ${{ github.event.inputs.expect_version }}
          MONITOR_ALLOWED_VERSIONS: ${{ steps.versions.outputs.allowed }}
          MONITOR_ALLOW_GATE: ${{ github.event.inputs.allow_gate == 'true' && '1' || vars.HM_MONITOR_ALLOW_GATE }}
        run: |
          set +e
          node hushmallow/tools/ops/monitor.mjs --json "$RUNNER_TEMP/monitor.json" | tee "$RUNNER_TEMP/monitor.txt"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the incident issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create prod-monitor --color B60205 --description 'hushmallow production monitor' 2>/dev/null || true
          body="$(printf 'The production monitor failed at %s.\n\n```\n%s\n```\n\nRun: %s\n\nRunbook: hushmallow/docs/ops/ROLLBACK.md' "$(date -u +%FT%TZ)" "$(cat "$RUNNER_TEMP/monitor.txt")" "$RUN_URL")"
          open="$(gh issue list --label prod-monitor --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label prod-monitor --title "Production monitor: $(tail -1 "$RUNNER_TEMP/monitor.txt" | cut -c1-120)" --body "$body"
          fi
          exit 1

      - name: Close the incident issue when healthy again
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open="$(gh issue list --label prod-monitor --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Healthy again at $(date -u +%FT%TZ): $(tail -1 "$RUNNER_TEMP/monitor.txt")"
            gh issue close "$open" --reason completed
          fi
