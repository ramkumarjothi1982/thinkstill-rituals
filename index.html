<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  <meta name="description" content="ThinkStill — complete guided rituals." />
  <title>ThinkStill Reset</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <button id="closeBtn" class="square-btn" type="button" aria-label="Back">×</button>
        <div class="brand-pill"><strong>ThinkStill</strong><span>Mind Reset</span></div>
      </div>
      <div class="top-actions">
        <button id="themeToggle" class="mode-btn" type="button">☾ Dark</button>
      </div>
    </header>

    <section class="composer" aria-label="Tell ThinkStill what is happening">
      <textarea id="thoughtInput" maxlength="700" rows="1" placeholder="Tell me what is happening…"></textarea>
      <button id="sendBtn" class="send-btn" type="button" aria-label="Show ritual">➤</button>
    </section>

    <section id="welcome" class="welcome-card">
      <p class="eyebrow">YOUR RESET</p>
      <h1>Type what is happening in your mind.</h1>
      <p>ThinkStill will match one of the 400 rituals and show the <strong>entire ritual</strong> below — no collapsed or hidden sections.</p>
      <button id="randomBtn" class="primary" type="button">Give me a ritual</button>
    </section>

    <section id="ritualScreen" class="ritual-screen" hidden>
      <div class="ritual-toolbar">
        <div class="bubble-line">
          <span id="bubblePill" class="bubble-pill">GLITCH BUBBLE</span>
          <span id="timePill" class="time-pill">1–2 minutes</span>
        </div>
        <div class="ritual-tools">
          <button id="copyBtn" type="button">Copy</button>
          <button id="saveBtn" type="button">Save</button>
        </div>
      </div>

      <article class="ritual-card" id="ritualCard">
        <section class="content-section title-section">
          <div class="section-label">TITLE</div>
          <h2 id="ritualTitle"></h2>
        </section>

        <section class="content-section">
          <div class="section-label">GOAL</div>
          <p id="ritualGoal" class="goal"></p>
        </section>

        <section class="content-section">
          <div class="section-label">RITUAL</div>
          <ol id="stepsList" class="steps"></ol>
        </section>

        <section class="content-section win-section">
          <div class="section-label">WIN</div>
          <p id="ritualWin" class="win"></p>
          <ul id="supportsList" class="supports"></ul>
        </section>

        <section class="content-section">
          <div class="section-label">FORMULA FLOW</div>
          <div id="flow" class="flow"></div>
        </section>

        <section class="content-section safety-section">
          <div class="section-label">SAFETY</div>
          <div class="pause-label">PAUSE</div>
          <p id="safety" class="safety"></p>
        </section>
      </article>

      <div class="bottom-actions">
        <button id="anotherBtn" class="primary" type="button">Another ritual →</button>
        <button id="changeBtn" class="secondary" type="button">Change what I typed</button>
      </div>
      <p id="progressText" class="progress"></p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
