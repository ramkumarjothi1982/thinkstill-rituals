<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThinkStill Reset</title><link rel="stylesheet" href="./styles.css">
</head>
<body><main class="shell">
<div class="brand">THINKSTILL RESET</div>
<h1 class="hero">Tell me what your mind is doing.</h1>
<p class="sub">ThinkStill routes your words to one short mental game. No bubble picker. No repeats until the full 400 are used.</p>
<div class="ask"><textarea id="input" placeholder="e.g. I keep replaying what I said and I'm sure they think badly of me"></textarea><button id="go">Give me a reset</button></div>
<section id="card" class="card hide">
  <div class="meta"><span id="bubble"></span><span id="time"></span></div>
  <h2 id="title" class="title"></h2><p id="goal" class="goal"></p>
  <div id="steps"></div><div id="win" class="win"></div><div id="supports" class="supports"></div>
  <div id="flow" class="flow"></div><div id="safety" class="safety"></div>
  <div class="foot"><span id="status"></span><button id="reset" class="reset">Reset history</button></div>
</section>
</main>
<script src="./thinkstill-loader.js"></script><script src="./app.js"></script>
<script>
(async()=>{
 await ThinkStill.init("./manifest.json");
 const $=id=>document.getElementById(id);
 function render(result){
   const r=result.ritual;
   $("bubble").textContent=r.bubble+" · "+result.match.trigger;
   $("time").textContent=r.play_time;$("title").textContent=r.title;$("goal").textContent=r.goal;
   $("steps").innerHTML=r.steps.map(s=>`<div class="step"><b>${s.n}. ${s.move}</b><p>${s.action}</p></div>`).join("");
   $("win").textContent=r.win;
   $("supports").innerHTML=r.supports.map(x=>`<p>• ${x}</p>`).join("");
   $("flow").textContent="FORMULA FLOW · "+r.formula_flow;
   $("safety").textContent=r.safety;
   $("status").textContent=`${result.seen_count}/400 used · ${result.remaining} unseen`;
   $("card").classList.remove("hide");
 }
 $("go").onclick=()=>{const text=$("input").value.trim();if(text)render(ThinkStill.select(text));};
 $("input").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")$("go").click();});
 $("reset").onclick=()=>{ThinkStill.resetHistory();$("status").textContent="History reset · 400 unseen";};
})();
</script></body></html>
