<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ThinkStill v36 Consumer Ritual Demo</title>
  <style>
    body { margin:0; background:#08080b; color:#f5f5f7; font-family:Inter,system-ui,sans-serif; }
    main { max-width:720px; margin:48px auto; padding:0 22px 64px; }
    .eyebrow { opacity:.58; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    h1 { font-size:34px; line-height:1.05; margin:10px 0 26px; }
    .goal { font-size:19px; line-height:1.55; opacity:.9; }
    .step { padding:16px 0; border-bottom:1px solid rgba(255,255,255,.09); }
    .step b { display:block; margin-bottom:7px; }
    .win { margin-top:28px; padding:18px; border:1px solid rgba(255,255,255,.14); border-radius:16px; }
    .flow { margin-top:22px; font-family:ui-monospace,monospace; opacity:.8; }
    .safety { margin-top:30px; font-size:13px; opacity:.58; line-height:1.5; }
  </style>
</head>
<body>
<main id="app">Loading…</main>
<script type="module">
  const rawBase = "."
  const rituals = await fetch(`${rawBase}/rituals.json`).then(r => r.json())
  const r = rituals[0]
  document.querySelector("#app").innerHTML = `
    <div class="eyebrow">${r.bubble} · ${r.playTime}</div>
    <h1>${r.display.title}</h1>
    <div class="goal">${r.display.goal}</div>
    <section>
      ${r.display.steps.map(s => `<div class="step"><b>${s.number}. ${s.label}</b>${s.instruction}</div>`).join("")}
    </section>
    <div class="win"><b>WIN</b><br>${r.display.win}</div>
    <div class="flow">${r.display.formulaFlow}</div>
    <div class="safety"><b>PAUSE</b><br>${r.display.safety.pause}<br><br>${r.display.safety.disclaimer}</div>
  `
</script>
</body>
</html>
