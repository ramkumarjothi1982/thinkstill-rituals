<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThinkStill Full Ritual Test</title>
<style>
body{background:#07090b;color:#fff;font-family:system-ui;margin:0}
main{max-width:760px;margin:40px auto;padding:24px}
.card{background:#111519;border:1px solid #33404a;border-radius:24px;padding:32px}
.meta{opacity:.65}.goal{font-size:20px;line-height:1.5;margin:18px 0 28px}
.step{padding:14px 0;border-bottom:1px solid #26313a}.step b{display:block;margin-bottom:6px}
.win,.flow,.safety{margin-top:28px;padding:18px;border-radius:16px;background:#171d22}
</style>
</head>
<body>
<main><div id="app">Loading ritual…</div></main>
<script type="module">
const rituals = await fetch("./rituals.json").then(r => r.json())
const r = rituals[0]
document.querySelector("#app").innerHTML = `
<div class="card">
<div class="meta">${r.bubble} · ${r.playTime}</div>
<h1>${r.title}</h1>
<div class="goal"><b>GOAL</b><br>${r.goal}</div>
${r.stepsStructured.map(s => `<div class="step"><b>${s.number}. ${s.label}</b>${s.instruction}</div>`).join("")}
<div class="win"><b>WIN</b><br>${r.win}</div>
<div class="flow"><b>FORMULA FLOW</b><br>${r.formulaFlow}</div>
<div class="safety"><b>PAUSE</b><br>${r.pause}<br><br>${r.disclaimer}</div>
</div>`
</script>
</body>
</html>
