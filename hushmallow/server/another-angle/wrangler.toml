# Another Angle server for hushmallow Beyond (Cloudflare Worker).
# Deployed by .github/workflows/another-angle.yml when CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set. Secrets (never in this file):
#   ANTHROPIC_API_KEY   the Claude API key
#   TOKEN_SIGNING_KEY   ≥32 random characters; signs device/session tokens
#   IP_HASH_KEY         ≥16 random characters; keys the IP hashes used for limits
#   TESTER_INVITE_CODES comma-separated invite codes for testers (recommended
#                       for the testing phase; without it anyone can get a session)
name = "hushmallow-another-angle"
main = "src/index.js"
compatibility_date = "2026-10-01"
# No nodejs_compat needed: @anthropic-ai/sdk runs on the Workers runtime as
# is (checked under `wrangler dev`; the API key is passed explicitly).
workers_dev = true

# The versioned system prompt is bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
PROVIDER = "anthropic"
MODEL = "claude-opus-5-5"
EFFORT = "low"
MAX_TOKENS = "3000"
MODEL_TIMEOUT_MS = "15000"
REQUEST_DEADLINE_MS = "28000"
MODEL_MAX_RETRIES = "1"
REFUSAL_FALLBACK = "default"
ALLOWED_ORIGINS = "https://app.hushmallow.com,https://hushmallow.pages.dev,https://ramkumarjothi1982.github.io"
ALLOW_NO_ORIGIN = "false"
REQUIRE_HTTPS = "true"
ENTITLEMENT_MODE = "testing"
TESTING_TOKEN_TTL_DAYS = "30"
DEVICE_DAILY_LIMIT = "20"
SESSION_DAILY_CAP = "500"
SESSIONS_PER_IP_DAILY = "10"
DAILY_SPEND_CAP_USD = "10"
APPLE_BUNDLE_ID = ""
APPLE_PRODUCT_IDS = "hushmallow.ultra.monthly,hushmallow.ultra.yearly"
APPLE_ENVIRONMENTS = "Production"

# Daily counters: per-device quota, per-IP session cap, global spend cap.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

# Burst limits per IP (per Cloudflare location). period must be 10 or 60.
[[ratelimits]]
name = "ANGLE_IP_LIMITER"
namespace_id = "41001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "SESSION_IP_LIMITER"
namespace_id = "41002"
simple = { limit = 3, period = 60 }

# Feedback has its own budget, so "Show me another angle" (feedback + a new
# angle) never uses up the angle burst limit.
[[ratelimits]]
name = "FEEDBACK_IP_LIMITER"
namespace_id = "41003"
simple = { limit = 20, period = 60 }

# Workers Logs keep only the server's own metadata lines (src/log.js).
# Invocation logs are OFF: they would store each request's headers and
# Cloudflare's geolocation (city, postcode, coordinates, network) next to
# those lines. Traces are off for the same reason. After the first deploy,
# check in the dashboard (Workers & Pages → this Worker → Logs) that no IP
# address, location or header appears. See README "What is logged".
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

# Local development: `npm run dev` (wrangler dev --env dev) uses the mock
# provider and allows localhost origins. Put secrets in .dev.vars.
[env.dev]
name = "hushmallow-another-angle-dev"
workers_dev = true

[env.dev.vars]
PROVIDER = "mock"
MODEL = "claude-opus-5-5"
EFFORT = "low"
MAX_TOKENS = "3000"
MODEL_TIMEOUT_MS = "15000"
REQUEST_DEADLINE_MS = "28000"
MODEL_MAX_RETRIES = "1"
REFUSAL_FALLBACK = "default"
ALLOWED_ORIGINS = "http://localhost:8000,http://127.0.0.1:8000,https://ramkumarjothi1982.github.io"
ALLOW_NO_ORIGIN = "true"
REQUIRE_HTTPS = "false"
ENTITLEMENT_MODE = "testing"
TESTING_TOKEN_TTL_DAYS = "30"
DEVICE_DAILY_LIMIT = "50"
SESSION_DAILY_CAP = "500"
SESSIONS_PER_IP_DAILY = "50"
DAILY_SPEND_CAP_USD = "2"
APPLE_BUNDLE_ID = ""
APPLE_PRODUCT_IDS = "hushmallow.ultra.monthly,hushmallow.ultra.yearly"
APPLE_ENVIRONMENTS = "Sandbox"

[[env.dev.durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[env.dev.ratelimits]]
name = "ANGLE_IP_LIMITER"
namespace_id = "41101"
simple = { limit = 30, period = 60 }

[[env.dev.ratelimits]]
name = "SESSION_IP_LIMITER"
namespace_id = "41102"
simple = { limit = 10, period = 60 }

[[env.dev.ratelimits]]
name = "FEEDBACK_IP_LIMITER"
namespace_id = "41103"
simple = { limit = 60, period = 60 }

[env.dev.observability]
enabled = true
redact_query_string = true

[env.dev.observability.logs]
enabled = true
invocation_logs = false

[env.dev.observability.traces]
enabled = false

# Staging: the real model, a separate Worker with its own keys and a small
# spending cap, deployed from a work branch by
# .github/workflows/another-angle-staging.yml (edit deploy/STAGING to run it).
# Lets the whole path (session → angle → feedback) be checked against the
# real model before anything is merged to main.
[env.staging]
name = "hushmallow-another-angle-staging"
workers_dev = true

[env.staging.vars]
PROVIDER = "anthropic"
MODEL = "claude-opus-5-5"
EFFORT = "low"
MAX_TOKENS = "3000"
MODEL_TIMEOUT_MS = "15000"
REQUEST_DEADLINE_MS = "28000"
MODEL_MAX_RETRIES = "1"
REFUSAL_FALLBACK = "default"
ALLOWED_ORIGINS = "https://ramkumarjothi1982.github.io,https://claude-upbeat-pasteur-b0aqg1.hushmallow.pages.dev,http://localhost:8000,http://127.0.0.1:8000"
ALLOW_NO_ORIGIN = "false"
REQUIRE_HTTPS = "true"
ENTITLEMENT_MODE = "testing"
TESTING_TOKEN_TTL_DAYS = "7"
DEVICE_DAILY_LIMIT = "20"
SESSION_DAILY_CAP = "100"
SESSIONS_PER_IP_DAILY = "10"
DAILY_SPEND_CAP_USD = "3"
APPLE_BUNDLE_ID = ""
APPLE_PRODUCT_IDS = "hushmallow.ultra.monthly,hushmallow.ultra.yearly"
APPLE_ENVIRONMENTS = "Sandbox"

[[env.staging.durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

[[env.staging.ratelimits]]
name = "ANGLE_IP_LIMITER"
namespace_id = "41201"
simple = { limit = 6, period = 60 }

[[env.staging.ratelimits]]
name = "SESSION_IP_LIMITER"
namespace_id = "41202"
simple = { limit = 3, period = 60 }

[[env.staging.ratelimits]]
name = "FEEDBACK_IP_LIMITER"
namespace_id = "41203"
simple = { limit = 20, period = 60 }

[env.staging.observability]
enabled = true
redact_query_string = true

[env.staging.observability.logs]
enabled = true
invocation_logs = false

[env.staging.observability.traces]
enabled = false
