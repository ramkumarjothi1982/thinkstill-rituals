<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ThinkStill Ritual Console</title>
  <meta name="theme-color" content="#071015" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="ts-shell">
    <header class="ts-topbar">
      <div class="ts-toplabel">Ritual</div>
      <button id="resetBtn" class="ts-reset" type="button">RESET CONSOLE</button>
      <div class="ts-spacer"></div>
    </header>

    <section class="ts-stage">
      <button id="backBtn" class="ts-nav ts-nav-left" type="button" aria-label="Previous ritual">‹</button>
      <article id="ritualCard" class="ts-card">
        <div id="emptyState" class="ts-empty">
          <div class="ts-empty-kicker">THINKSTILL</div>
          <h1>What is your mind doing right now?</h1>
          <p>Type it below. ThinkStill will route you to the best unused ritual.</p>
        </div>
        <div id="ritualContent" hidden></div>
      </article>
      <button id="nextBtn" class="ts-nav ts-nav-right" type="button" aria-label="Next best ritual">›</button>
      <div id="mediaStage" class="ts-media-stage" hidden>
        <div id="mediaFrame" class="ts-media-frame"></div>
      </div>
    </section>

    <div id="avatar" class="ts-avatar" hidden></div>

    <footer class="ts-inputbar">
      <button id="micBtn" class="ts-mic" type="button" aria-label="Voice input">●</button>
      <input id="input" type="text" autocomplete="off" placeholder="Tell ThinkStill what is happening…" />
      <button id="enterBtn" class="ts-enter" type="button">ENTER</button>
    </footer>

    <div id="status" class="ts-status">Loading ritual library…</div>
  </main>

  <script src="thinkstill-loader.js"></script>
  <script src="thinkstill-router.js"></script>
  <script src="app.js"></script>
</body>
</html>
