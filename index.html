<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1017">
  <title>ThinkStill Reset</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">THINKSTILL</div>
        <h1>Reset</h1>
      </div>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light and dark mode">☀ / ☾</button>
    </header>

    <section class="input-card" aria-label="Find a ritual">
      <label for="issue">What is your mind doing right now?</label>
      <div class="input-row">
        <input id="issue" type="text" autocomplete="off" placeholder="e.g. I keep imagining the worst">
        <button id="findBtn" type="button">Find my reset</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section id="ritualCard" class="ritual-card hidden" aria-live="polite">
      <div class="ritual-topline">
        <span id="bubbleBadge" class="bubble-badge"></span>
        <span id="playTime" class="play-time"></span>
      </div>
      <h2 id="ritualTitle"></h2>

      <div class="section">
        <div class="section-label">GOAL</div>
        <p id="goal"></p>
      </div>

      <div class="section">
        <div class="section-label">RITUAL</div>
        <div id="steps" class="steps"></div>
      </div>

      <div class="win-box">
        <div class="section-label">WIN</div>
        <p id="win"></p>
      </div>

      <div class="section">
        <div class="section-label">SUPPORT</div>
        <div id="supports" class="support-lines"></div>
      </div>

      <div class="section">
        <div class="section-label">FORMULA FLOW</div>
        <div id="formulaFlow" class="formula-flow"></div>
      </div>

      <details class="safety">
        <summary>Safety</summary>
        <div id="safety"></div>
      </details>

      <div class="actions">
        <button id="anotherBtn" class="secondary" type="button">Another reset</button>
        <button id="copyBtn" class="secondary" type="button">Copy ritual</button>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
