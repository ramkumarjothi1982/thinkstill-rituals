# Real-model quality check for Another Angle (hushmallow Beyond).
# Runs hushmallow/tools/angle-eval.mjs against Claude with the
# ANTHROPIC_API_KEY repository secret: 39 realistic inputs, graded by the
# deterministic quality gate and a judge rubric. Costs about $1.80 a run
# (worst case about $9), so it only runs when asked:
#   * edit hushmallow/server/another-angle/eval/RUN on a work branch, or
#   * Actions tab → "Another Angle eval" → Run workflow (once this file is on main).
# The markdown report is printed in the log and kept as a run artifact. The
# inputs are synthetic test sentences, never anyone's real words.
name: Another Angle eval

on:
  push:
    branches: ['claude/**']
    paths: ['hushmallow/server/another-angle/eval/RUN']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: another-angle-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hushmallow/server/another-angle
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=No ANTHROPIC_API_KEY::Add the ANTHROPIC_API_KEY repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hushmallow/server/another-angle/package-lock.json
      - run: npm ci
      - name: Run the eval
        run: |
          args="$(cat eval/RUN 2>/dev/null | grep -E '^--' | tr '\n' ' ')"
          node ../../tools/angle-eval.mjs --yes --out "$RUNNER_TEMP/eval" $args
      - name: Print the report
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/eval/*.md; do [ -f "$f" ] && { echo "===== $f"; cat "$f"; }; done
          for f in "$RUNNER_TEMP"/eval/*.json; do [ -f "$f" ] && { echo "===== $f (scenes)"; node -e "const r=require(process.argv[1]); for (const x of r.results) for (const [i,y] of (x.rounds||[]).entries()) console.log([x.id, i, y.status, y.scene?.reasoning_pattern||'', y.scene?.mallow_character||'', JSON.stringify(y.scene?.subtitle_line_1||''), JSON.stringify(y.scene?.subtitle_line_2||''), (y.meta?.gate_failures||y.meta?.gate||'')+'' , y.ms+'ms'].join(' | '))" "$f"; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: another-angle-eval
          path: ${{ runner.temp }}/eval
          retention-days: 14
