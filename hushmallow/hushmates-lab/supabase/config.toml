# Supabase CLI settings for Hushmates (a separate project: never the main Hushmallow one).
# `supabase link --project-ref <staging ref>` before using it; see docs/STAGING.md.
project_id = "hushmates"

[api]
# the Edge Function reaches its database functions through PostgREST, as the service role
# only (no other role may execute them): the schema must be exposed for that
schemas = ["public", "graphql_public", "hushmates_api"]

[auth]
# passwordless email codes; people can't sign up without an email code
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[functions.hushmates]
# the function checks every token itself (and the scheduler's route carries none)
verify_jwt = false
