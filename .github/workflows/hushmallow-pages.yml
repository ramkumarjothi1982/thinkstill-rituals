# Publishes the Hushmallow web app (the hushmallow/ folder) to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then run this workflow (Actions tab → "Publish
# Hushmallow" → Run workflow), or push to main.
name: Publish Hushmallow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['hushmallow/**', '.github/workflows/hushmallow-pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hushmallow-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test hushmallow/tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # the app only, in a folder named after this commit so every deploy
      # reaches people straight away instead of after their browser cache
      # expires (see hushmallow/tools/build-site.sh)
      - name: Assemble site
        run: hushmallow/tools/build-site.sh _site "${GITHUB_SHA::12}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
