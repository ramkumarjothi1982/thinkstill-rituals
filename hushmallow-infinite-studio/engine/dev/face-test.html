<!doctype html>
<html><head><meta charset="utf-8"><title>Face test</title>
<style>html,body{margin:0;background:#222;color:#ddd;font:14px sans-serif} canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="1000"></canvas>
<script type="module">
import { MALLOWS } from '../../../hushmallow/src/mallows/registry.js';
import { Face, specFromRig } from '../face.js';
const load = (src) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = src; });
const params = new URLSearchParams(location.search);
const art = await load(params.get('art') || '../../../hushmallow/assets/source/hires/noomi.webp');
const k = +(params.get('k') || 2.70), ox = +(params.get('ox') || 32), oy = +(params.get('oy') || 125);
const measured = params.get('rig') ? null : await (await fetch('../noomi-face-measured.json')).json();
const spec = measured ? measured.spec : specFromRig(MALLOWS.noomi.face, k, ox, oy);
const fc = document.createElement('canvas'); fc.width = art.width; fc.height = art.height;
const face = new Face(spec, fc);
const c = document.getElementById('c'), g = c.getContext('2d');
const box = [180, 520, 1080, 1000];  // art px region shown in each cell
const S = 0.55, CW = (box[2] - box[0]) * S, CH = (box[3] - box[1]) * S;
const cells = [
  ['approved art', { mode: 'art' }],
  ['art + neutral overlay (diff)', { mode: 'diff' }],
  ['neutral (flat body)', {}],
  ['surprised take', { eyeOpen: 1.3, eyeScale: 1.12, eyeStretch: 1.08, irisScale: 0.62, mouthRound: 1, mouthOpen: 0.7, mouthSmile: 0 }],
  ['anxious, look left', { eyeOpen: 1.0, irisScale: 0.8, lookX: -0.8, lookY: -0.1, browAlpha: 0.8, browY: 0.35, browTilt: 0.8, mouthSmile: -0.35, mouthWave: 0.8, mouthWidth: 0.75, mouthOpen: 0.1 }],
  ['sleepy half-open', { eyeOpen: 0.45, lidTop: 0.3, lookY: 0.2, mouthSmile: 0.6 }],
  ['open, content', { eyeOpen: 0.95, lidBot: 0.2, irisScale: 1.08, sparkle: 1, mouthSmile: 1, blush: 0.6 }],
  ['blink 70%', { eyeOpen: 1.0, blink: 0.7, mouthSmile: 0.2 }],
  ['squeezed shut', { eyeOpen: 0, squint: 1, closedCurve: 0.55, mouthSmile: -0.2, mouthWidth: 0.8 }],
];
const bodyCol = '#a9dcfb';
for (let i = 0; i < cells.length; i++) {
  const [label, P] = cells[i];
  const cx = (i % 3) * (CW + 10) + 10, cy = Math.floor(i / 3) * (CH + 34) + 26;
  g.save();
  g.beginPath(); g.rect(cx, cy, CW, CH); g.clip();
  g.translate(cx, cy); g.scale(S, S); g.translate(-box[0], -box[1]);
  if (P.mode === 'art' || P.mode === 'diff') g.drawImage(art, 0, 0);
  else { g.fillStyle = bodyCol; g.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); }
  if (P.mode !== 'art') {
    face.last = ''; face.ctx.clearRect(0, 0, fc.width, fc.height);
    face.draw(P.mode === 'diff' ? {} : P);
    if (P.mode === 'diff') { g.globalAlpha = 0.55; }
    g.drawImage(fc, 0, 0);
    g.globalAlpha = 1;
  }
  g.restore();
  g.fillStyle = '#ddd'; g.fillText(label, cx, cy - 8);
}
window.__done = true;
</script></body></html>
