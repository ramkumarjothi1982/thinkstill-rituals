<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MallowTouch lab</title>
<style>html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 100%,#2b2163,#0a0818 70%);color:#f7f3ff;font:15px system-ui;overflow:hidden}
#stage{position:absolute;inset:0}#bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
button{background:#1e1a44;color:#fff;border:1px solid #fff3;border-radius:99px;padding:6px 10px}</style></head>
<body><div id="bar"></div><div id="stage"></div>
<script type="module">
import { SoftMallow } from './src/hushfold/touch/mallow-touch.js';
import { MALLOW_IDS } from './src/mallows/registry.js';
const qs = new URLSearchParams(location.search);
let rig;
function show(id){ rig?.destroy(); rig = new SoftMallow(document.getElementById('stage'), { id, bindSelf: true }); window.__rig = rig; rig.on('touch', (e) => console.log('touch', JSON.stringify(e))); }
for (const id of MALLOW_IDS) { const b = document.createElement('button'); b.textContent = id; b.onclick = () => show(id); bar.append(b); }
show(qs.get('m') || 'glitzi');
</script></body></html>
