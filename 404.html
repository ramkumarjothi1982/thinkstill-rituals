<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<meta name="description" content="ThinkStill — complete guided mind resets.">
<title>ThinkStill Reset</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
<header class="topbar">
<div class="brand-wrap"><button id="closeBtn" class="square-btn" type="button">×</button><div class="brand-pill"><strong>ThinkStill</strong><span>Mind Reset</span></div></div>
<button id="themeToggle" class="mode-btn" type="button">☾ Dark</button>
</header>
<section class="composer"><textarea id="thoughtInput" maxlength="700" rows="1" placeholder="Tell me what is happening…"></textarea><button id="sendBtn" class="send-btn" type="button">➤</button></section>
<section id="welcome" class="welcome-card"><p class="eyebrow">YOUR RESET</p><h1>What is happening in your mind?</h1><p>ThinkStill matches your words to an unused ritual and shows the complete reset.</p><button id="randomBtn" class="primary" type="button">Give me a ritual</button></section>
<section id="ritualScreen" class="ritual-screen" hidden>
<div class="ritual-toolbar"><div class="bubble-line"><span id="bubblePill" class="bubble-pill"></span><span id="timePill" class="time-pill"></span></div><div class="ritual-tools"><button id="copyBtn">Copy</button><button id="saveBtn">Save</button></div></div>
<article class="ritual-card">
<section class="content-section title-section"><h2 id="ritualTitle"></h2></section>
<section class="content-section"><div class="section-label">GOAL</div><p id="ritualGoal" class="goal"></p></section>
<section class="content-section steps-section"><ol id="stepsList" class="steps"></ol></section>
<section class="content-section win-section"><div class="section-label">WIN</div><p id="ritualWin" class="win"></p><ul id="supportsList" class="supports"></ul></section>
<section class="content-section"><div class="section-label">FORMULA FLOW</div><div id="flow" class="flow"></div></section>
<section class="content-section safety-section"><div class="section-label">SAFETY</div><p id="safety" class="safety"></p></section>
</article>
<div class="bottom-actions"><button id="anotherBtn" class="primary">Another ritual →</button><button id="changeBtn" class="secondary">Change what I typed</button></div>
<p id="progressText" class="progress"></p>
</section>
</main>
<script src="app.js" defer></script>
</body>
</html>
