<!-- Supabase → Authentication → Emails → Templates → "Reauthentication". Subject: Your hushmallow code -->
<div style="margin:0;padding:32px 16px;background:#0a0818;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#f7f3ff">
  <div style="max-width:440px;margin:0 auto;padding:28px 24px;border-radius:22px;background:#1e1a44;border:1px solid rgba(255,255,255,.12)">
    <p style="margin:0 0 18px;font-size:20px;font-weight:800;letter-spacing:-.01em">hushmallow</p>
    <h1 style="margin:0 0 10px;font-size:22px;line-height:1.25;font-weight:700">Your code</h1>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.5;color:#cdc6ea">To change your password, enter this code in hushmallow:</p>
    <p style="margin:0 0 22px;font-size:32px;font-weight:800;letter-spacing:.18em;color:#ffd98a">{{ .Token }}</p>
    <p style="margin:0 0 6px;font-size:14px;line-height:1.5;color:#918ab6">It works once and only for a short while. If you didn’t ask for it, someone may know your password: change it from the sign-in screen with “Forgot password”.</p>
    <p style="margin:18px 0 0;font-size:14px;color:#918ab6">Less noise. More magic.</p>
  </div>
</div>
