<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <title>ThinkStill Reset</title>
  <meta name="description" content="ThinkStill ritual engine — v58.20.5">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="brand">ThinkStill</div><div class="subbrand">RITUAL</div></div>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch theme">☀</button>
    </header>

    <section id="startCard" class="panel start-card">
      <div class="eyebrow">WHAT IS YOUR MIND DOING?</div>
      <h1>Enter what is happening.</h1>
      <textarea id="mindInput" maxlength="700" placeholder="Example: I keep thinking the worst will happen."></textarea>
      <button id="enterBtn" class="primary-btn" type="button">ENTER</button>
      <div class="privacy">This static demo keeps your text in the browser.</div>
    </section>

    <section id="ritualView" class="panel ritual-view hidden" aria-live="polite">
      <div class="ritual-meta"><span id="bubbleBadge" class="badge"></span><span id="playTime"></span></div>
      <h2 id="ritualTitle"></h2>

      <section class="card"><div class="label">GOAL</div><p id="goalText"></p></section>
      <ol id="stepsList" class="steps"></ol>
      <section class="card win-card"><div class="label">WIN</div><p id="winText"></p></section>
      <section class="card"><div class="label">MIND BEND</div><p id="mindBendText"></p></section>
      <section class="card"><div class="label">FORMULA FLOW</div><p id="flowText" class="flow"></p></section>
      <details class="card safety-card"><summary>Safety</summary><p id="safetyText"></p></details>

      <section class="feedback-row">
        <div id="feedbackPrompt" class="feedback-prompt">Did that shift anything?</div>
        <div id="feedbackOptions" class="feedback-options"></div>
      </section>

      <div class="actions">
        <button id="anotherBtn" class="primary-btn" type="button">ANOTHER RITUAL</button>
        <button id="doneBtn" class="secondary-btn" type="button">DONE</button>
      </div>
    </section>

    <footer>Self-help only. Not emergency, medical, or crisis care.</footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
